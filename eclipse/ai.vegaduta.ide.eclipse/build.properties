source.. = src/
output.. = target/classes/
bin.includes = META-INF/,\
               .,\
               plugin.xml,\
               icons/,\
               webview/,\
               about.html

# webview/ receives the shared chat bundle, copied from clients/shared/dist/webview by the
# maven-resources-plugin execution in pom.xml. Those three files are build output and
# never committed (see clients/eclipse/.gitignore), exactly like the JetBrains plugin.
# A build made before "npm run build:webview" ships only the directory README, and
# the view says so at runtime. See webview/README.txt for why one file is tracked.

# icons/ holds the winged-emblem PNGs generated by clients/scripts/generate_brand_icons.py
# (plugin.xml's view icon). Before 0.3.0 it was missing from bin.includes, so the built
# jar shipped without them and the view had no icon.
